[project]
name = "imessageriff-tools"
version = "0.1.0"
description = "Content tools for iMessageRiff: chart conversion, draft difficulty reduction, audio generation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["imessageriff_tools*"]

[tool.setuptools.package-data]
imessageriff_tools = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
