# XcodeGen spec. Run `xcodegen generate` (or scripts/bootstrap.sh) to create Riff.xcodeproj, which is
# generated and never committed. Identifiers and the signing team come from Config/Base.xcconfig.
name: Riff

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  RiffCore:
    path: Packages/RiffCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  # The iMessage app itself: a stub with no code that only carries the extension and the store icon.
  Riff:
    type: application.messages
    platform: iOS
    sources:
      - path: RiffApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RIFF_BUNDLE_PREFIX).Riff
        INFOPLIST_FILE: RiffApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RiffMessages

  # Everything the player sees runs here.
  RiffMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: RiffMessages
    settings:
      base:
        # The extension id must start with the app id.
        PRODUCT_BUNDLE_IDENTIFIER: $(RIFF_BUNDLE_PREFIX).Riff.MessagesExtension
        INFOPLIST_FILE: RiffMessages/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        # UI code is main-actor by default (Xcode 26 and later; older Xcodes ignore these two).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    dependencies:
      - package: RiffCore
        product: RiffCore

schemes:
  Riff:
    build:
      targets:
        Riff: all
        RiffMessages: all
    run:
      config: Debug
    archive:
      config: Release
