# XcodeGen spec. Run `xcodegen generate` (or scripts/bootstrap.sh) to create iMessageRiff.xcodeproj, which is
# generated and never committed. Identifiers and the signing team come from Config/Base.xcconfig.
name: iMessageRiff

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  iMessageRiffCore:
    path: Packages/iMessageRiffCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  # The iMessage app itself: a stub with no code that only carries the extension and the store icon.
  iMessageRiff:
    type: application.messages
    platform: iOS
    sources:
      - path: iMessageRiffApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RIFF_APP_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: iMessageRiffApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: iMessageRiffMessages

  # Everything the player sees runs here.
  iMessageRiffMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: iMessageRiffMessages
    settings:
      base:
        # The extension id must start with the app id.
        PRODUCT_BUNDLE_IDENTIFIER: $(RIFF_APP_BUNDLE_IDENTIFIER).MessagesExtension
        INFOPLIST_FILE: iMessageRiffMessages/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        # UI code is main-actor by default (Xcode 26 and later; older Xcodes ignore these two).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    dependencies:
      - package: iMessageRiffCore
        product: iMessageRiffCore

schemes:
  iMessageRiff:
    build:
      targets:
        iMessageRiff: all
        iMessageRiffMessages: all
    run:
      config: Debug
    archive:
      config: Release
